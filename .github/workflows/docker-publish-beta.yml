name: Publish Beta Docker Image

on:
  push:
    tags:
      - '*.*.*-beta'
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Extract Git tag
      id: get_version
      env:
        DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      run: |
        echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
        echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        echo "dockerhub_image=${DOCKERHUB_IMAGE:-twoplay/craftybot}" >> "$GITHUB_ENV"

    # DockerHub is optional. Without those credentials the job still publishes to
    # GHCR instead of failing with "Username and password required".
    - name: Check for DockerHub credentials
      id: dockerhub
      env:
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; publishing to GHCR only."
        fi

    # Docker Login
    - name: Log in to DockerHub
      if: steps.dockerhub.outputs.enabled == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Docker Image Build. A beta build never claims the `latest` tag.
    - name: Build and tag Docker image
      run: |
        echo "Building ghcr.io/$repository:$tag"
        docker build -t "ghcr.io/$repository:beta" -t "ghcr.io/$repository:$tag" .

    - name: Tag DockerHub image
      if: steps.dockerhub.outputs.enabled == 'true'
      run: |
        docker tag "ghcr.io/$repository:beta" "$dockerhub_image:beta"
        docker tag "ghcr.io/$repository:$tag" "$dockerhub_image:$tag"

    # Push to GitHub Packages
    - name: Push GitHub image
      run: |
        docker push "ghcr.io/$repository:beta"
        docker push "ghcr.io/$repository:$tag"

    # Push to DockerHub
    - name: Push DockerHub image
      if: steps.dockerhub.outputs.enabled == 'true'
      run: |
        docker push "$dockerhub_image:beta"
        docker push "$dockerhub_image:$tag"
